<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hair Care Services</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; }
        .service-img { height: 150px; margin: 10px 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select, button { width: 100%; padding: 8px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Hair Care Services Appointment</h1>
    
    <!-- Placeholder for service images -->
    <div id="service-images">
        <p>Images for services (hair oil, head massage, total hair detox) will be added here.</p>
    </div>

    <form id="appointmentForm">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required>
        </div>
        <div class="form-group">
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="service">Select Service:</label>
            <select id="service" name="service" required>
                <option value="">Choose a service</option>
                <option value="hair oil">Hair Oil</option>
                <option value="head massage">Head Massage</option>
                <option value="total hair detox">Total Hair Detox</option>
            </select>
        </div>
        <button type="submit">Submit Appointment</button>
    </form>

    <p>Submitted data will be stored and accessible via a database (to be set up later).</p>
</body>
</html>
